version: "0.14.3"
name: "Chapter Rule Fact Binding"
description: |
  定义 Chapter Rules 如何从 Engineering Facts 中选择章节上下文。
  不直接读取算法原始文件，所有路径均面向工程事实层。

flow:
  - Engineering Facts
  - Chapter Rule required_facts
  - Chapter Context
  - LLM generation

constraints:
  - source_paths 仅用于事实定位，不代表原始算法文件路径
  - 缺失 required fact 时进入 confirmation/gap 流程
  - LLM 不允许绕过 fact binding 自行推断工程参数
