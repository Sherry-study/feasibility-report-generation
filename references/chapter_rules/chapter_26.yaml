contract_version: "1.0"
rule_id: chapter_26
rule_status: active
plan_section: "26"
sections:
  - section_id: "26.1"
    title: 综合评价
    coverage_class: llm_narrative
    required_facts: []
    context_paths:
      - project.project_name
      - project.objectives
      - project.changes
      - adopted_scheme.scheme_name
      - adopted_scheme.scheme_description
      - diagnosis.yield_summary
      - process.retrofit.product_streams
      - fa.annual_capacity
      - fa.utility_margin
      - fa.investment
      - fa.financial_evaluation
      - implementation_schedule
      - consistency
    output:
      allowed_headings: ["26.1.1 技术方案综合评价", "26.1.2 工程实施条件综合评价", "26.1.3 投资与经济性综合评价"]
      required_structure:
        - heading: "26.1.1 技术方案综合评价"
          requirements:
            - "本节只做综合判断，不重新展开装置诊断过程。用1～2个关键事实说明推荐方案针对的主要问题，再评价技术路线是否明确、是否具备实现改造目标的基础。"
            - "不重复4.1.3的候选方案比选过程，不罗列完整设备动作，不连续堆叠转化率、纯度、设备数量等细节。"
        - heading: "26.1.2 工程实施条件综合评价"
          requirements:
            - "从现有装置依托条件、主要新增/改造范围、施工组织和公用工程等角度概括工程实施基础及关键约束。"
            - "只写会影响下一阶段实施的主要条件；设备位号、接口、专项校核等细项若已在前文说明，此处归并表达，不逐条展开。"
        - heading: "26.1.3 投资与经济性综合评价"
          requirements:
            - "根据现有投资估算和财务评价结果给出阶段性经济评价；若尚未形成完整指标，说明当前评价深度及尚需补充的工程量、价格和财务基础资料。"
            - "不得给出推测性经济指标，不使用“数据闭合、闭合路径、专业输入状态”等系统化表述。"
    research: {mode: none, task_templates: [], condition_key: null, policy_hook: null, target_sections: []}
    generation_rules:
      must_include: []
      forbidden: ["推测性经济指标", "内部候选编号", "工程拓扑", "数据闭合", "闭合路径", "对象一致性", "专业输入状态"]
    quality_checks: ["是否以综合判断为主而非重复前文章节", "是否只保留影响项目结论的关键事实", "综合评价是否只使用报告内事实"]
  - section_id: "26.2"
    title: 研究报告的结论
    coverage_class: llm_narrative
    required_facts: []
    context_paths:
      - project.project_name
      - project.objectives
      - project.changes
      - adopted_scheme.scheme_name
      - adopted_scheme.scheme_description
      - process.retrofit.product_streams
      - fa.annual_capacity
      - fa.utility_margin
      - fa.investment
      - fa.financial_evaluation
      - implementation_schedule
      - consistency
    output:
      allowed_headings: ["26.2 研究报告的结论"]
      required_structure:
        - heading: "26.2 研究报告的结论"
          requirements:
            - "用2～3个自然段给出全报告最终阶段判断：技术方案是否具备可行性基础、当前是否具备推进下一阶段工作的条件、投资决策前尚需落实哪些关键事项。"
            - "不重新复述完整技术方案、诊断数据和设备清单；关键指标如已在26.1出现，本节原则上不再重复。"
            - "结论使用建设单位和设计人员可直接理解的工程语言；将分散缺口归并为少量关键实施前提，不使用“闭合条件、工程拓扑、对象一致性”等内部过程词。"
            - "投资或财务评价未完成时，只能形成技术与工程层面的阶段性结论，最终投资决策应以完成的投资估算和财务评价为依据。"
    research: {mode: none, task_templates: [], condition_key: null, policy_hook: null, target_sections: []}
    generation_rules:
      must_include: []
      forbidden: ["新增数字", "投资决策确定结论", "工程拓扑", "数据闭合", "闭合条件", "对象一致性"]
    quality_checks: ["是否形成明确阶段结论", "是否避免与1.2和26.1重复", "是否将待办归并为关键实施前提"]
