contract_version: "1.0"
rule_id: chapter_2
rule_status: active
plan_section: "2"
sections:
  - section_id: "2"
    title: 市场预测
    coverage_class: llm_narrative
    required_facts: []
    context_paths: [project.project_name, process.retrofit.product_streams, process.design.product_streams, user.market_geography]
    output:
      allowed_headings: ["2.1 产品市场分析", "2.1.1 产品用途及下游领域", "2.1.2 市场供需现状及预测", "2.2 产品的竞争力分析", "2.4 价格预测"]
      required_structure:
        - {heading: "2.1 产品市场分析", requirements: ["作为2.1.1/2.1.2上位标题，可不单独写正文。"]}
        - {heading: "2.1.1 产品用途及下游领域", requirements: ["说明产品用途、主要下游领域及需求驱动因素；只使用可核验证据。"]}
        - {heading: "2.1.2 市场供需现状及预测", requirements: ["区分历史事实与趋势判断；证据不足或来源冲突时不得给出精确市场规模、产能或增速。"]}
        - {heading: "2.2 产品的竞争力分析", requirements: ["结合项目事实与市场证据；缺企业客户或成本资料时保留条件。"]}
        - {heading: "2.4 价格预测", requirements: ["有可靠价格依据才描述趋势；财务评价价格必须由建设单位确认。"]}
    research: {mode: required, task_templates: [], condition_key: null, policy_hook: market_forecast_2, target_sections: ["2"]}
    generation_rules: {must_include: [], forbidden: ["用公开市场价替代建设单位评价价格", "虚构精确预测值"]}
    quality_checks: ["市场数字是否均有证据支撑"]
