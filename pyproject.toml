[project]
name = "feasibility-report-generation"
version = "0.1.0"
description = "可研报告生成 FastMCP 服务"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.5",
    "starlette==1.6.0",
    "httpx==0.28.1",
    "python-docx==1.2.0",
    "PyYAML==6.0.3",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "src", "duck"]
