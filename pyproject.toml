[project]
name = "feasibility-report-generation"
version = "0.1.0"
description = "可研报告生成 FastMCP 服务"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "starlette>=0.37.0",
    "httpx>=0.27.0",
    "python-docx>=1.1.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "src", "internal", "duck"]