contract_version: "1.0"
rule_id: chapter_4
rule_status: active
plan_section: "4.1"
sections:
  - section_id: "4.1.1"
    title: 原料路线确定的原则和依据
    coverage_class: llm_narrative
    required_facts: []
    context_paths: [project.changes, process.design.feed_streams, process.retrofit.feed_streams, user]
    output:
      allowed_headings: ["4.1.1 原料路线确定的原则和依据"]
      required_structure:
        - heading: "4.1.1 原料路线确定的原则和依据"
          requirements: ["说明本项目原料路线确定的原则。", "结合项目事实说明实际原料路线；无路线调整时写沿用既有路线。", "仅使用项目事实与报告内已有数据，不引入新的外部数字。", "不出现内部候选编号及内部实现术语。"]
    research: {mode: conditional, task_templates: [], condition_key: null, policy_hook: raw_material_route_review_411, target_sections: ["4.1.1"]}
    generation_rules: {must_include: [], forbidden: ["企业原料来源和价格由公开资料代替"]}
    quality_checks: ["原料路线变化状态是否与chapter_plan一致"]
  - section_id: "4.1.2"
    title: 国内、外工艺技术概况
    coverage_class: llm_narrative
    required_facts: []
    context_paths: [project.changes, process, adopted_scheme]
    output:
      allowed_headings: ["4.1.2 国内、外工艺技术概况"]
      required_structure:
        - heading: "4.1.2 国内、外工艺技术概况"
          requirements: ["概述主要工艺技术路线类型及工业化情况。", "明确本项目为扩能改造时是否改变既有工艺路线。", "仅使用项目事实与报告内已有数据，外部技术资料不得替代本项目专业计算。"]
    research: {mode: conditional, task_templates: [], condition_key: null, policy_hook: technology_review_412, target_sections: ["4.1.2"]}
    generation_rules: {must_include: [], forbidden: ["把文献性能直接当成本项目性能"]}
    quality_checks: ["工艺路线变化状态是否与chapter_plan一致"]
  - section_id: "4.1.3.2"
    title: 技术、消耗、设备、投资与风险比较
    coverage_class: llm_narrative
    required_facts: []
    context_paths:
      - scheme_analysis.candidates
      - adopted_scheme.scheme_name
      - adopted_scheme.scheme_description
      - equipment.reactor.solution_sets
    output:
      allowed_headings: ["4.1.3.2 技术、消耗、设备、投资与风险比较"]
      required_structure:
        - heading: "4.1.3.2 技术、消耗、设备、投资与风险比较"
          requirements:
            - "围绕已识别的主要工艺问题和改造目标进行工程方案比选，正文重点解释各候选方案“能解决什么问题、主要怎么改、主要优缺点是什么”。"
            - "仅比较已有项目事实能够支撑的维度，可包括技术效果、改造范围、现有设备利用、实施难度、停工影响和运行风险；没有事实依据的消耗、投资、运行费用等维度不得猜测或机械写成多列“待确认”。"
            - "候选方案比选表由系统自动渲染，正文不重复逐行抄表；应提炼造成方案取舍差异的1～3个关键因素。"
            - "最终推荐方案必须与adopted_scheme一致，并用工程理由说明为什么更适合本项目；不得把内部初筛分数、候选排序或算法试错过程作为推荐依据。"
            - "若经济比较资料暂不具备，仅用一句正常工程表述说明投资及运行费用需在后续技经工作中进一步比选，不展开系统缺失状态。"
    research: {mode: none, task_templates: [], condition_key: null, policy_hook: null, target_sections: []}
    generation_rules:
      must_include: []
      forbidden: ["内部方案ID", "初筛评分", "验证优先级", "工程拓扑", "评分最高者自动等同采用方案", "算法排序", "candidate"]
    quality_checks: ["是否解释方案取舍而非复述评分", "采用方案是否与adopted_scheme一致", "无事实依据的比较维度是否被省略"]
  - section_id: "4.1.3"
    title: 工艺技术方案的比较和选择
    coverage_class: deterministic_only
    required_facts:
      - fact_id: adopted_scheme
        description: 已确认采用方案
        source_paths: [adopted_scheme.scheme_name, adopted_scheme.scheme_description, scheme_analysis]
        responsibility: [C]
        required: true
        missing_action: confirmation_required
    context_paths:
      - diagnosis.yield_summary
      - diagnosis.bottlenecks
      - scheme_analysis.candidates
      - adopted_scheme.scheme_name
      - adopted_scheme.scheme_description
      - equipment.reactor.solution_sets
    output:
      allowed_headings: ["4.1.3 工艺技术方案的比较和选择"]
      required_structure:
        - heading: "4.1.3 工艺技术方案的比较和选择"
          requirements:
            - "本节围绕主要瓶颈，对候选改造方案进行工程比选并说明推荐理由；专业确认的采用方案不得被改写。"
            - "叙述顺序为“需要解决的主要问题 → 候选方案及差异 → 关键取舍因素 → 推荐方案及理由”。"
            - "内部候选评分、验证优先级、算法排序、工程化处理过程不属于可研正文，不得写入。"
            - "没有可靠依据的投资、消耗和运行费用不得补造；缺失项不应形成大段“待确认”式正文。"
    research: {mode: none, task_templates: [], condition_key: null, policy_hook: null, target_sections: []}
    generation_rules:
      must_include: []
      forbidden: ["改写采用方案", "内部候选编号", "初筛评分", "验证优先级", "工程拓扑", "算法排序"]
    quality_checks: ["方案选择是否与确认事实一致", "是否使用工程比选逻辑解释推荐理由"]
  - {section_id: "4.1.4", title: 工艺技术描述, coverage_class: deterministic_only, required_facts: [], context_paths: [adopted_scheme, process, equipment], research: {mode: none, task_templates: [], condition_key: null, policy_hook: null, target_sections: []}}
  - {section_id: "4.2.4", title: 主要工艺设备一览表, coverage_class: deterministic_only, required_facts: [], context_paths: [equipment], research: {mode: none, task_templates: [], condition_key: null, policy_hook: null, target_sections: []}}
  - section_id: "4.4"
    title: 自动控制
    coverage_class: template_rendered
    required_facts: []
    context_paths: [project.changes, user.control_scope, equipment]
    research: {mode: none, task_templates: [], condition_key: null, policy_hook: null, target_sections: []}
    generation_rules: {must_include: [], forbidden: ["无事实依据确定控制系统配置"]}
    quality_checks: ["自控范围缺口是否保留为条件"]
