contract_version: '1.0'
rule_id: chapter_19_21
rule_status: provisional
plan_section: '19'
sections:
- section_id: '19'
  title: 投资估算
  coverage_class: deterministic_only
  required_facts:
  - fact_id: investment_inputs
    description: 投资估算工程量、价格、取费依据
    source_paths:
    - fa.investment
    - finance.investment
    - user.investment_inputs
    responsibility:
    - FA
    - U
    required: true
    missing_action: allow_open_item
  context_paths:
  - equipment
  - adopted_scheme
  - fa.investment
  - finance.investment
  - user.investment_inputs
  output:
    allowed_headings:
    - 19 投资估算
    required_structure:
    - heading: 19 投资估算
      requirements:
      - 说明估算范围、价格基准、取费依据和缺口。
      - 无可靠工程量或询价时不得生成金额。
      - 公开价格只能作为估算参考并标明来源日期。
  research:
    mode: none
    task_templates: []
    condition_key: null
    policy_hook: null
    target_sections: []
  generation_rules:
    must_include: []
    forbidden:
    - 生成投资金额
    - 无规则生成费率
  quality_checks:
  - 投资输入缺口是否明确
- section_id: '20'
  title: 资金筹措
  coverage_class: deterministic_only
  required_facts: []
  context_paths:
  - finance
  - user.financing_structure
  research:
    mode: none
    task_templates: []
    condition_key: null
    policy_hook: null
    target_sections: []
- section_id: '21'
  title: 财务分析
  coverage_class: deterministic_only
  required_facts:
  - fact_id: financial_inputs
    description: 投资、价格、成本、税费、融资等财务评价输入
    source_paths:
    - fa.financial_evaluation
    - finance.financial_inputs
    - user.financial_inputs
    responsibility:
    - FA
    - U
    - C
    required: true
    missing_action: allow_open_item
  context_paths:
  - fa.financial_evaluation
  - finance
  - user.financial_inputs
  - user.financing_structure
  output:
    allowed_headings:
    - 21 财务分析
    required_structure:
    - heading: 21 财务分析
      requirements:
      - 说明外部财税或基准参数与企业输入的边界。
      - 无完整输入时不得计算财务评价指标。
      - 市场价不能直接替代建设单位评价价格。
  research:
    mode: none
    task_templates: []
    condition_key: null
    policy_hook: null
    target_sections: []
  generation_rules:
    must_include: []
    forbidden:
    - IRR
    - NPV
    - 投资回收期
    - 利润
    - 收入
    - 成本结果
  quality_checks:
  - 财务评价是否只说明边界和缺口
