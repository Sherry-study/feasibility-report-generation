contract_version: "1.0"
rule_id: chapter_1
rule_status: active
plan_section: "1.1"
sections:
  - section_id: "1.1.2"
    title: 主办单位基本情况
    coverage_class: llm_narrative
    required_facts:
      - fact_id: construction_unit
        description: 建设单位或主办单位名称
        source_paths: [project.construction_unit, user.construction_unit, user.owner]
        responsibility: [U]
        required: true
        missing_action: ask_user
    context_paths: [project.project_name, project.construction_unit, user.construction_unit, user.owner, enterprise.basic_profile]
    output:
      allowed_headings: ["1.1.2 主办单位基本情况"]
      required_structure:
        - heading: "1.1.2 主办单位基本情况"
          requirements: ["建设单位名称必须来自项目事实或用户输入，不得从Web反推。", "公开资料仅补充企业基本情况、主营业务和可核验经营背景。", "不得把媒体推测、未经披露产能或其他公司的信息写入本项目。"]
    research: {mode: conditional, task_templates: [], condition_key: null, policy_hook: enterprise_profile_112, target_sections: ["1.1.2"]}
    generation_rules: {must_include: [], forbidden: ["从项目名称反推建设单位", "未经确认的企业产能"]}
    quality_checks: ["建设单位名称是否来自确认事实"]
  - section_id: "1.1.3"
    title: 项目提出的背景、投资的目的、意义和必要性
    coverage_class: llm_narrative
    required_facts: []
    context_paths: [project.project_name, project.objectives, project.changes, diagnosis, adopted_scheme, scheme_analysis]
    output:
      allowed_headings: ["1.1.3 项目提出的背景、投资的目的、意义和必要性"]
      required_structure:
        - heading: "1.1.3 项目提出的背景、投资的目的、意义和必要性"
          requirements: ["以项目目标、现状诊断和企业事实为主线。", "外部政策或行业证据仅作为背景支撑。", "不得用宏观政策反推本项目一定必要。"]
    research: {mode: none, task_templates: [], condition_key: null, policy_hook: null, target_sections: []}
    generation_rules:
      must_include: []
      policy_baseline:
        status: fixed_in_package
        maintenance: "仅作为工业技术改造的通用政策背景；项目必要性必须由项目目标、现状诊断和企业事实支撑。政策库版本更新时统一维护，不在每个项目首跑重复联网。"
        items:
          - title: "推动大规模设备更新和消费品以旧换新行动方案"
            document_no: "国发〔2024〕7号"
            publisher: "国务院"
            relevance: "提出推进重点行业设备更新改造，围绕节能降碳、安全生产、数字化转型、智能化升级等方向推动技术改造。"
            official_url: "https://www.ndrc.gov.cn/xwdt/ztzl/tddgmsbgxhxfpyjhx/gzdt/202404/t20240417_1365727_ext.html"
          - title: "推动工业领域设备更新实施方案"
            document_no: "工信部联规〔2024〕53号"
            publisher: "工业和信息化部等七部门"
            relevance: "明确以大规模设备更新为抓手实施制造业技术改造升级工程，推动工业领域设备更新和技术改造。"
            official_url: "https://www.miit.gov.cn/zwgk/zcwj/wjfb/tz/art/2024/art_3a8bb9999baa45039305de354c868244.html"
      forbidden: ["宏观政策替代项目事实", "为了政策背景再次联网搜索"]
    quality_checks: ["必要性结论是否来自项目事实"]
  - section_id: "1.2"
    title: 研究结论
    coverage_class: llm_narrative
    required_facts: []
    context_paths:
      - project.project_name
      - project.project_type
      - project.objectives
      - project.changes
      - diagnosis.yield_summary
      - diagnosis.bottlenecks
      - adopted_scheme.scheme_name
      - adopted_scheme.scheme_description
      - process.design.product_streams
      - process.retrofit.product_streams
      - fa.annual_capacity
      - fa.investment
      - fa.financial_evaluation
      - implementation_schedule
    output:
      allowed_headings: ["1.2 研究结论"]
      required_structure:
        - heading: "1.2 研究结论"
          requirements:
            - "本节是面向项目决策的结论摘要，不是对全部工程事实的再次罗列。"
            - "按“项目目的及主要问题 → 推荐方案及关键改造思路 → 改造后核心效果 → 当前工程/经济评价条件 → 总体结论”的顺序组织，形成4～6个自然段。"
            - "诊断只保留支撑项目必要性的1～2项关键事实；不展开设备级诊断过程，不重复后文章节中的完整设备清单和参数。"
            - "推荐方案使用业务名称和工程语言说明，只概括主要改造思路；不得描述候选排序、验证优先级、模型判断过程或内部工程化过程。"
            - "生产规模、产品指标等只保留影响决策的核心结果；没有明确事实支撑的市场、投资或财务结论不补写。"
            - "投资估算或财务评价尚未完成时，用正常可研语体说明尚需落实的工程量、价格或财务基础资料，不使用“数据闭合、专业输入、状态未闭合”等系统语言。"
            - "结尾给出当前研究阶段能够成立的总体判断，并明确下一阶段最关键的实施前提；不使用空泛套话。"
    research: {mode: none, task_templates: [], condition_key: null, policy_hook: null, target_sections: []}
    generation_rules:
      must_include: []
      forbidden: ["内部候选编号", "推测性经济结论", "验证优先级", "工程拓扑", "数据闭合", "专业输入", "模型判断", "算法推荐"]
    quality_checks: ["是否形成决策摘要而非全量事实复述", "是否只保留关键数字", "结论是否与项目事实一致", "是否不存在内部研发/流程语言"]
