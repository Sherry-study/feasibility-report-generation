meta:
  version: 1.0
  source: 用户提供的《XXXX精细化工有限公司扩能改造项目_可研报告》
  policy: 当前MVP作为固定规范库直接使用，不做例行联网校核；后续由用户/设计院明确提出版本更新时再维护。企业事实和项目专属条件不得从案例继承。
  verification_status: fixed_seed_for_current_mvp
report_compilation:
  basis:
  - 可行性研究报告编制深度参照《化工投资项目可行性研究报告编制办法》（2012年修订版），中国石油和化学工业协会中石化协产发〔2012〕115号。
  principles:
  - 按照国民经济和社会发展长远规划，行业、地区发展规划及国家的产业政策、技术政策的要求，在项目调查、比选的基础上，对项目进行全面论证。
  - 坚持以市场为导向，以效益为中心；坚持质量、成本、效益原则，以技术的先进性、可靠性、适用性为依托，采用当前国内、外最先进的生产工艺，实现技术领先和节能降耗，提高企业竞争力和经济效益，实现社会效益的最大化。
  - 坚持以人为本和可持续发展原则，奉行“健康-安全-环保”的理念，认真贯彻国家环保、节能、消防、劳动安全卫生等有关法规。严格执行“三同时”，主体工程与环境保护、降低能耗、安全生产、工业卫生同步考虑，执行清洁生产、安全生产、循环经济和可持续发展原则，实现环境、经济、社会效益三统一。
  - 最大限度地降低工程造价是工程自始至终贯穿的一条基本原则，在技术先进可靠的基础上，坚持走国产化的道路，以减少项目的投资。
  - 项目的实施执行国家相关的法律和法规，并充分发挥当地的区位和资源优势，实现地方经济和企业经济可持续发展，兼顾项目未来发展需求，充分利用国家和地方优惠政策，提高本工程的经济效益和社会效益。
  - 总图布置力求布局合理，在兼顾环境、安全、生产的前提下，采用集中化、模块化布置，以最大限度地节约用地。
  - 力求全面客观地反映项目的情况，提供科学的决策依据。
