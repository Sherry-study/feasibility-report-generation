# 算法输出字段结构化词典（机器可读）
# 权威语义见同目录 algorithm_output_semantics.md；两者冲突时以该文件为准。
# 路径模式约定：[] 匹配数组元素（下标已归一化）；* 匹配任意单段动态键（组分名/设备ID/流股ID等）；
# ** 作为末段匹配该前缀下任意深度（用于映射表未逐项列明的容器分支）。
# 注意：实际 JSON 顶层可能有单根包装（如 plant_info.json 顶层仅 plant_info 一个键，
# design_case/retrofit_case 嵌套其下），pattern 一律按实际结构书写。
version: "1.2"
algorithm_output_versions: [v3, v7]
policy: |
  表内字段照表确定性提取；表外字段由 mapping_coverage 显式记录（unmapped_paths），
  不静默丢弃、不阻断流程、不由 LLM 自动推断进正文。unmapped 清单仅供词典维护时
  人工/agent 复核：有报告价值则补入本词典，无决策价值可忽略。
source_types:
  reactor_result:
    description: 反应器算法输出（plant_reactor_result）
    patterns:
      - {path: "reactors[].id", meaning: 反应器唯一编号}
      - {path: "reactors[].tag", meaning: 反应器位号；空=新反应器无位号}
      - {path: "reactors[].name", meaning: 反应器名称}
      - {path: "reactors[].type", meaning: 设备类型 reactor}
      - {path: "reactors[].form", meaning: 固定床/列管式}
      - {path: "reactors[].is_new_reactor", meaning: 是否新增反应器}
      - {path: "reactors[].has_heat_transfer", meaning: 是否有换热}
      - {path: "reactors[].utility_medium", meaning: 公用工程介质 HO/CW；空=无换热}
      - {path: "reactors[].flow_pattern", meaning: 换热流动方式；空=无换热}
      - {path: "reactors[].evaluation.space_velocity.available", meaning: 空速指标是否可用}
      - {path: "reactors[].evaluation.space_velocity.status", meaning: 空速评估状态 pass/fail}
      - {path: "reactors[].evaluation.space_velocity.exceeded", meaning: 新工况空速是否超参考}
      - {path: "reactors[].evaluation.space_velocity.reference_LHSV_h1", meaning: 参考液时空速 h-1}
      - {path: "reactors[].evaluation.space_velocity.new_LHSV_h1", meaning: 新工况液时空速 h-1}
      - {path: "reactors[].evaluation.space_velocity.LHSV_ratio", meaning: 新/参考空速比}
      - {path: "reactors[].evaluation.space_velocity.conclusion", meaning: 空速评估结论}
      - {path: "reactors[].evaluation.heat_load.available", meaning: 热负荷指标是否可用}
      - {path: "reactors[].evaluation.heat_load.status", meaning: 热负荷评估状态}
      - {path: "reactors[].evaluation.heat_load.exceeded", meaning: 热负荷是否超换热能力}
      - {path: "reactors[].evaluation.heat_load.has_heat_transfer", meaning: 是否有换热}
      - {path: "reactors[].evaluation.heat_load.new_heat_load_abs_W", meaning: 新工况热负荷绝对值 W}
      - {path: "reactors[].evaluation.heat_load.Q_max_W", meaning: 设备最大换热能力 W}
      - {path: "reactors[].evaluation.heat_load.heat_load_ratio", meaning: 热负荷/换热能力比}
      - {path: "reactors[].evaluation.heat_load.heat_capacity_sufficient", meaning: 换热能力是否充足}
      - {path: "reactors[].evaluation.heat_load.conclusion", meaning: 热负荷评估结论}
      - {path: "reactors[].evaluation.adiabatic_temperature.available", meaning: 绝热温度指标是否可用}
      - {path: "reactors[].evaluation.adiabatic_temperature.status", meaning: 绝热温度评估状态}
      - {path: "reactors[].evaluation.adiabatic_temperature.exceeded", meaning: 是否超温}
      - {path: "reactors[].evaluation.adiabatic_temperature.bottleneck_type", meaning: 温度瓶颈类型}
      - {path: "reactors[].evaluation.adiabatic_temperature.known_target_outlet_temperature_c", meaning: 已知目标出口温度}
      - {path: "reactors[].evaluation.adiabatic_temperature.equipment_process_design_temperature_c", meaning: 设备工艺设计温度}
      - {path: "reactors[].evaluation.adiabatic_temperature.equipment_temperature_sufficient", meaning: 设计温度是否满足}
      - {path: "reactors[].evaluation.adiabatic_temperature.process_temperature_limits_c.min", meaning: 工艺温度下限}
      - {path: "reactors[].evaluation.adiabatic_temperature.process_temperature_limits_c.max", meaning: 工艺温度上限}
      - {path: "reactors[].evaluation.adiabatic_temperature.process_temperature_sufficient", meaning: 工艺温度是否满足}
      - {path: "reactors[].evaluation.adiabatic_temperature.adiabatic_temperature_change_C", meaning: 绝热温度变化}
      - {path: "reactors[].evaluation.adiabatic_temperature.adiabatic_temperature_rise_C", meaning: 绝热温升}
      - {path: "reactors[].evaluation.adiabatic_temperature.adiabatic_temperature_drop_C", meaning: 绝热温降}
      - {path: "reactors[].evaluation.adiabatic_temperature.adiabatic_metric_used_as_outlet_temperature", meaning: 绝热指标是否被用作出口温度}
      - {path: "reactors[].evaluation.adiabatic_temperature.conclusion", meaning: 绝热温度评估结论}
      - {path: "reactors[].evaluation_status", meaning: 该反应器评估总状态}
      - {path: "reactors[].retrofit_required", meaning: 该反应器是否需要改造}
      - {path: "reactors[].volumetric_flow_m3_h", meaning: 新增反应器入口体积流量}
      - {path: "reactors[].target_LHSV_h1", meaning: 目标液时空速}
      - {path: "reactors[].required_volume_m3", meaning: 所需有效体积}
      - {path: "reactors[].conclusion", meaning: 该反应器评估汇总结论}
      - {path: "reactors[].validation", meaning: 改造工况出口组成验证是否通过}
      - {path: "reactors[].operating_conditions.design.**", meaning: 设计工况操作条件（温度/压力/体积流量的 value+unit）}
      - {path: "reactors[].operating_conditions.retrofit.**", meaning: 改造工况操作条件（温度/压力/体积流量的 value+unit）}
      - {path: "reactors[].operating_conditions.run.**", meaning: 运行工况操作条件（温度/压力/体积流量的 value+unit）}
      - {path: "reactors[].retrofit.required_effective_volume_m3", meaning: 满足新工况所需有效体积}
      - {path: "reactors[].retrofit.current_effective_volume_per_unit_m3", meaning: 单台当前有效体积}
      - {path: "reactors[].retrofit.current_operating_quantity", meaning: 当前运行台数}
      - {path: "reactors[].retrofit.current_operating_total_effective_volume_m3", meaning: 当前总有效体积}
      - {path: "reactors[].retrofit.volume_increase_m3", meaning: 需增加的有效体积}
      - {path: "reactors[].retrofit.schemes[].scheme_type", meaning: add_parallel/increase_volume/reuse/new_reactor}
      - {path: "reactors[].retrofit.schemes[].scheme_index", meaning: 方案序号}
      - {path: "reactors[].retrofit.schemes[].description", meaning: 方案描述}
      - {path: "reactors[].retrofit.schemes[].reused_from", meaning: 利旧来源反应器ID}
      - {path: "reactors[].retrofit.schemes[].total_volume", meaning: 单台总容积; null=沿用原规格或未定规格}
      - {path: "reactors[].retrofit.schemes[].diameter", meaning: 设备直径 mm}
      - {path: "reactors[].retrofit.schemes[].cylinder_height", meaning: 筒体高度 mm}
      - {path: "reactors[].retrofit.schemes[].catalyst_volume", meaning: 催化剂装填有效体积}
      - {path: "reactors[].retrofit.schemes[].heat_exchange_area", meaning: 换热面积; null=无换热}
      - {path: "reactors[].retrofit.schemes[].tube_count", meaning: 列管数; null=无换热}
      - {path: "reactors[].retrofit.schemes[].quantity", meaning: 设备数量 台}
      - {path: "reactors[].retrofit.schemes[].total_effective_volume_m3", meaning: 方案总有效体积}
      - {path: "reactors[].retrofit.schemes[].total_weight", meaning: 设备总重量 kg; null=未定规格}
      - {path: "reactors[].retrofit.schemes[].operating_conditions.inlet_temperature_c", meaning: 入口温度}
      - {path: "reactors[].retrofit.schemes[].operating_conditions.inlet_pressure_mpag", meaning: 入口压力 MPaG}
      - {path: "reactors[].retrofit.schemes[].operating_conditions.mass_flow_kg_h", meaning: 入口质量流量}
      - {path: "reactors[].retrofit.schemes[].operating_conditions.utility.medium", meaning: 公用工程介质}
      - {path: "reactors[].retrofit.schemes[].operating_conditions.utility.inlet_temperature_c", meaning: 公用工程入口温度}
      - {path: "reactors[].retrofit.schemes[].operating_conditions.utility.outlet_temperature_c", meaning: 公用工程出口温度}
      - {path: "reactors[].retrofit.schemes[].operating_conditions.utility.mass_flow_kg_h", meaning: 公用工程质量流量}
      - {path: "retrofit_required", meaning: 装置是否需要改造}
      - {path: "conclusion", meaning: 装置级汇总结论}
      - {path: "combined_schemes[].total_new_equipment_volume_m3", meaning: 组合方案新增有效体积合计}
      - {path: "combined_schemes[].conclusion", meaning: 组合方案结论}
      - {path: "combined_schemes[].scheme_index", meaning: 组合方案序号}
      - {path: "combined_schemes[].reuse[].id", meaning: 利旧设备ID}
      - {path: "combined_schemes[].reuse[].name", meaning: 利旧设备名称}
      - {path: "combined_schemes[].reuse[].scheme_type", meaning: 利旧方案类型}
      - {path: "combined_schemes[].reuse[].reused_from", meaning: 利旧来源ID}
      - {path: "combined_schemes[].reuse[].**", meaning: 利旧方案设备列表字段；空=无}
      - {path: "combined_schemes[].addition[].**", meaning: 新增/扩容方案设备列表}
      - {path: "combined_schemes[].parallel[].**", meaning: 并联方案设备列表}
      - {path: "combined_schemes[].heat_transfer[].**", meaning: 换热改造设备列表}
      - {path: "combined_schemes[].no_retrofit[].**", meaning: 无需改造设备列表}
      - {path: "combined_schemes[].scheme_id", meaning: 组合方案唯一标识 combined_N}
      - {path: "selected_combined_scheme.total_new_equipment_volume_m3", meaning: 用户选定组合方案新增有效体积合计}
      - {path: "selected_combined_scheme.conclusion", meaning: 用户选定组合方案结论}
      - {path: "selected_combined_scheme.scheme_index", meaning: 用户选定组合方案序号}
      - {path: "selected_combined_scheme.scheme_id", meaning: 用户选定组合方案唯一标识 combined_N}
      - {path: "selected_combined_scheme.reuse[].id", meaning: 用户选定方案利旧设备ID}
      - {path: "selected_combined_scheme.reuse[].name", meaning: 用户选定方案利旧设备名称}
      - {path: "selected_combined_scheme.reuse[].scheme_type", meaning: 用户选定方案利旧方案类型}
      - {path: "selected_combined_scheme.reuse[].reused_from", meaning: 用户选定方案利旧来源ID}
      - {path: "selected_combined_scheme.reuse[].**", meaning: 用户选定方案利旧设备列表字段；空=无}
      - {path: "selected_combined_scheme.addition[].**", meaning: 用户选定方案新增/扩容设备列表}
      - {path: "selected_combined_scheme.parallel[].**", meaning: 用户选定方案并联设备列表}
      - {path: "selected_combined_scheme.heat_transfer[].**", meaning: 用户选定方案换热改造设备列表}
      - {path: "selected_combined_scheme.no_retrofit[].**", meaning: 用户选定方案无需改造设备列表}
  tower_result:
    description: 塔器算法输出（v7 为主，含 v3 差异字段）
    patterns:
      - {path: "separator[].id", meaning: 塔唯一编号}
      - {path: "separator[].name", meaning: 塔名称}
      - {path: "separator[].type", meaning: separator/extractor/reactor_separator}
      - {path: "separator[].detail.success", meaning: 塔核算是否成功}
      - {path: "separator[].detail.optimal.require", meaning: 分离要求校核结果 布尔}
      - {path: "separator[].detail.optimal.hydraulic", meaning: 水力学校核结果 布尔}
      - {path: "separator[].detail.optimal.N_trays", meaning: 塔板数}
      - {path: "separator[].detail.optimal.feed_tray", meaning: 进料板位置}
      - {path: "separator[].detail.optimal.reflux_ratio", meaning: 回流比}
      - {path: "separator[].detail.optimal.P_top", meaning: 塔顶压力（注意单位口径见注意事项1）}
      - {path: "separator[].detail.optimal.P_bottom", meaning: 塔釜压力 MPa}
      - {path: "separator[].detail.optimal.QB_kW", meaning: 再沸器热负荷 kW（实际语义为热负荷）}
      - {path: "separator[].detail.optimal.T_top_C", meaning: 塔顶温度}
      - {path: "separator[].detail.optimal.impurity_info[].**", meaning: 杂质信息列表}
      - {path: "separator[].detail.state", meaning: 萃取塔超限方向}
      - {path: "separator[].detail.current_value", meaning: 萃取塔当前水力学指标值}
      - {path: "separator[].detail.upper_limit", meaning: 水力学指标上限}
      - {path: "separator[].detail.lower_limit", meaning: 水力学指标下限}
      - {path: "separator[].detail.hydro_limit.*", meaning: 对应流股水力学极限流量 kg/h}
      - {path: "separator[].detail.output.top.mass_flow", meaning: 塔顶产品质量流量 kg/h}
      - {path: "separator[].detail.output.top.mass_fraction.*", meaning: 塔顶产品各组分质量分数}
      - {path: "separator[].detail.output.bottom.mass_flow", meaning: 塔釜产品质量流量 kg/h}
      - {path: "separator[].detail.output.bottom.mass_fraction.*", meaning: 塔釜产品各组分质量分数}
      - {path: "separator[].detail.output.middle[].mass_flow", meaning: 侧线产品质量流量 kg/h}
      - {path: "separator[].detail.output.middle[].mass_fraction.*", meaning: 侧线产品组成}
      - {path: "separator[].detail.separator_limit.top.*.recovery_rate", meaning: 组分塔顶回收率}
      - {path: "separator[].detail.separator_limit.top.*.mass_fraction", meaning: 组分塔顶质量分数}
      - {path: "separator[].detail.separator_limit.bottom.*.recovery_rate", meaning: 组分塔釜回收率}
      - {path: "separator[].detail.separator_limit.bottom.*.mass_fraction", meaning: 组分塔釜质量分数}
      - {path: "separator[].detail.separator_limit._best_score", meaning: 最优分离综合得分}
      - {path: "separator[].retrofit.route", meaning: optimal/side/structure/parallel/series}
      - {path: "separator[].retrofit.success", meaning: 改造求解是否成功}
      - {path: "retrofit_required", meaning: 装置是否需要改造}
      - {path: "conclusion", meaning: 装置级塔器汇总结论}
      - {path: "combined_schemes.optimal[].**", meaning: 操作优化塔列表}
      - {path: "combined_schemes.parallel[].**", meaning: 并联塔列表（v3 为原塔新塔成对数组）}
      - {path: "combined_schemes.series[].**", meaning: 串联塔列表（v3为成对数组）}
      - {path: "combined_schemes.other[].**", meaning: 其他（改造失败/萃取塔）塔列表}
      # v3 plan_detail.optimal_ori（含 2.3 v3 补充字段；retrofit 下与顶层均可能出现）
      - {path: "separator[].plan_detail.optimal_ori.top_feed_direction", meaning: 上进料方向标志}
      - {path: "separator[].plan_detail.optimal_ori.bottom_feed_direction", meaning: 下进料方向标志}
      - {path: "separator[].plan_detail.optimal_ori.N_trays", meaning: 塔板数}
      - {path: "separator[].plan_detail.optimal_ori.feed_tray", meaning: 进料板位置}
      - {path: "separator[].plan_detail.optimal_ori.reflux_ratio", meaning: 回流比}
      - {path: "separator[].plan_detail.optimal_ori.P_top", meaning: 塔顶压力（疑似 bar，注意单位）}
      - {path: "separator[].plan_detail.optimal_ori.P_bottom", meaning: 塔釜压力}
      - {path: "separator[].plan_detail.optimal_ori.QB_kW", meaning: 再沸器热负荷 kW}
      - {path: "separator[].plan_detail.optimal_ori.T_top_C", meaning: 塔顶温度}
      - {path: "separator[].plan_detail.optimal_ori.feed", meaning: 进料量 kg/h}
      - {path: "separator[].plan_detail.optimal_ori.require[].position", meaning: 分离要求位置}
      - {path: "separator[].plan_detail.optimal_ori.require[]._site", meaning: 分离要求位置（下划线变量）}
      - {path: "separator[].plan_detail.optimal_ori.require[].tray_id", meaning: 侧线要求塔板号}
      - {path: "separator[].plan_detail.optimal_ori.require[].index", meaning: 指标类型 质量分数/回收率}
      - {path: "separator[].plan_detail.optimal_ori.require[].target", meaning: 目标值}
      - {path: "separator[].plan_detail.optimal_ori.require[].requirement", meaning: 要求方向 高于/低于}
      - {path: "separator[].plan_detail.optimal_ori.require[].stream", meaning: 要求对应流股}
      - {path: "separator[].plan_detail.optimal_ori.require[].current_value", meaning: 当前实际值}
      - {path: "separator[].plan_detail.optimal_ori.require[].reforce", meaning: 是否强制要求}
      - {path: "separator[].plan_detail.optimal_ori.require[]._pass", meaning: 是否达标}
      - {path: "separator[].plan_detail.optimal_ori.output.top.temperature", meaning: 塔顶温度 v3}
      - {path: "separator[].plan_detail.optimal_ori.output.top.pressure", meaning: 塔顶压力 v3}
      - {path: "separator[].retrofit.plan_detail.optimal_ori.**", meaning: 原塔操作参数（字段同上）}
      - {path: "separator[].retrofit.plan_detail.optimal_retrofit.**", meaning: 新塔操作参数（含feed_ratio；空对象=操作优化）}
      - {path: "separator[].retrofit.plan_detail.side_draws[].tray", meaning: 侧线采出塔板号}
      - {path: "separator[].retrofit.plan_detail.side_draws[].component", meaning: 目标组分名称}
      - {path: "separator[].retrofit.plan_detail.side_draws[].site", meaning: 采出位置 top/bottom/side}
      - {path: "separator[].retrofit.plan_detail.side_draws[].value", meaning: 组分浓度}
      - {path: "separator[].retrofit.plan_detail.side_draws[].requirement", meaning: 原始分离要求}
      - {path: "separator[].retrofit.plan_detail.device_paras.struct_info.[]", meaning: 塔体分段结构容器}
      - {path: "separator[].retrofit.plan_detail.device_paras.struct_info.[].[]", meaning: 塔径与板间距或填料高度数组}
      - {path: "separator[].retrofit.plan_detail.device_paras.tray_num", meaning: 塔板数}
      - {path: "separator[].retrofit.plan_detail.device_paras.feed_tray", meaning: 进料板}
      - {path: "separator[].retrofit.plan_detail.device_paras.feed_tray.[]", meaning: 进料板嵌套数组}
      - {path: "separator[].retrofit.plan_detail.device_paras.feed_tray.[].[]", meaning: 进料板嵌套数组元素}
      - {path: "separator[].retrofit.plan_detail.device_paras.tray_type", meaning: F1/seieve/BX等}
      - {path: "separator[].retrofit.plan_detail.device_paras.P_design", meaning: 设计压力 MPa}
      - {path: "separator[].retrofit.plan_detail.device_paras.plate_paras[].lw", meaning: 堰长 m}
      - {path: "separator[].retrofit.plan_detail.device_paras.plate_paras[].hw", meaning: 堰高 m}
      - {path: "separator[].retrofit.plan_detail.device_paras.plate_paras[].h0", meaning: 降液管底隙高度 m}
      - {path: "separator[].retrofit.plan_detail.device_paras.plate_paras[].Wd", meaning: 弓形降液管宽度 m}
      - {path: "separator[].retrofit.plan_detail.device_paras.plate_paras[].n", meaning: 浮阀/开孔数量}
      - {path: "separator[].retrofit.plan_detail.device_paras.plate_paras[].An", meaning: 单孔面积 m2}
      - {path: "separator[].retrofit.plan_detail.device_paras.plate_paras[].Af_AT", meaning: 降液管面积/塔截面积比}
      - {path: "separator[].retrofit.plan_detail.device_paras.plate_paras[].fluent_shape", meaning: 液流型式; 空对象=填料段}
      - {path: "separator[].detail.impurity_info.**", meaning: 杂质信息列表（detail 直挂结构）}
      - {path: "separator[].detail.separator_limit.**", meaning: 最优分离限制完整容器（含 N_trays 等扩展字段）}
      - {path: "separator[].detail.output.**", meaning: 塔顶塔釜侧线产出完整容器}
